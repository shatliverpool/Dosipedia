        // --- Main App Component ---
        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [pin, setPin] = useState('');
            const [loginError, setLoginError] = useState('');
            
            const [weight, setWeight] = useState('');
            const [selectedDrugId, setSelectedDrugId] = useState(DRUG_DATA[0].id);
            const [activeTab, setActiveTab] = useState('rate'); // 'rate' | 'conc'
            const [feedbackText, setFeedbackText] = useState('');
            const [feedbackSent, setFeedbackSent] = useState(false);

            // Concentration Calculator States
            const [concDrugAmount, setConcDrugAmount] = useState('');
            const [concFluidVolume, setConcFluidVolume] = useState('');
            const [concDoseRate, setConcDoseRate] = useState('');
            const [concDoseUnit, setConcDoseUnit] = useState('mcg/kg/min');

            const saveTimerRef = useRef(null);

            const selectedDrug = useMemo(() => {
                return DRUG_DATA.find(d => d.id === selectedDrugId) || DRUG_DATA[0];
            }, [selectedDrugId]);

            // Debounce Auto-save to Google Sheets (5 Seconds)
            useEffect(() => {
                if (!isLoggedIn) return;

                if (saveTimerRef.current) clearTimeout(saveTimerRef.current);

                saveTimerRef.current = setTimeout(() => {
                    sendToSheet();
                }, 5000);

                return () => {
                    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
                };
            }, [weight, selectedDrugId, activeTab, concDrugAmount, concFluidVolume, concDoseRate, concDoseUnit, isLoggedIn]);

            // Function to send data to GAS Sheet
            const sendToSheet = () => {
                if (!weight) return; // ไม่ส่งถ้ายังไม่ใส่น้ำหนัก

                const payload = {
                    timestamp: new Date().toISOString(),
                    weight: weight,
                    selectedDrug: selectedDrug.name,
                    calculatorMode: activeTab === 'rate' ? 'Rate Calculation' : 'Concentration Calculation',
                    concDrugAmount: concDrugAmount || '-',
                    concFluidVolume: concFluidVolume || '-',
                    concDoseRate: concDoseRate || '-',
                    concDoseUnit: concDoseUnit
                };

                // ส่งข้อมูลผ่าน API fetch หรือ google.script.run
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run.saveToSheet(payload);
                } else if (GAS_WEB_APP_URL && !GAS_WEB_APP_URL.includes("YOUR_SCRIPT_ID")) {
                    fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'saveToSheet', payload: payload })
                    }).catch(err => console.log('Auto-save err:', err));
                }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (pin === '123456') {
                    setIsLoggedIn(true);
                    setLoginError('');
                } else {
                    setLoginError('รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง');
                }
            };

            const handleSendFeedback = () => {
                if (!feedbackText.trim()) return;

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run.saveFeedback(feedbackText);
                } else if (GAS_WEB_APP_URL && !GAS_WEB_APP_URL.includes("YOUR_SCRIPT_ID")) {
                    fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'saveFeedback', payload: { text: feedbackText } })
                    }).catch(err => console.log('Feedback err:', err));
                }

                setFeedbackSent(true);
                setTimeout(() => {
                    setFeedbackText('');
                    setFeedbackSent(false);
                }, 3000);
            };

            // Calculate Dose Rate Results
            const rateResults = useMemo(() => {
                const w = parseFloat(weight);
                if (!w || isNaN(w) || w <= 0) return null;

                if (selectedDrug.channels) {
                    return selectedDrug.channels.map(ch => {
                        const minVal = (ch.min * w).toFixed(2);
                        const maxVal = (ch.max * w).toFixed(2);
                        return {
                            name: ch.name,
                            min: minVal,
                            max: maxVal,
                            unit: ch.unit,
                            isSingleValue: ch.min === ch.max
                        };
                    });
                } else {
                    const minVal = (selectedDrug.min * w).toFixed(2);
                    const maxVal = (selectedDrug.max * w).toFixed(2);
                    return [{
                        name: 'ขนาดยาที่แนะนำ',
                        min: minVal,
                        max: maxVal,
                        unit: selectedDrug.unit,
                        isSingleValue: selectedDrug.min === selectedDrug.max
                    }];
                }
            }, [weight, selectedDrug]);

            // Calculate IV Infusion Rate (ml/hr)
            const calculatedInfusionRate = useMemo(() => {
                const w = parseFloat(weight);
                const mg = parseFloat(concDrugAmount);
                const vol = parseFloat(concFluidVolume);
                const rate = parseFloat(concDoseRate);

                if (!w || !mg || !vol || !rate || w <= 0 || mg <= 0 || vol <= 0 || rate <= 0) return null;

                // Conc in mcg/ml
                const concMcgMl = (mg * 1000) / vol;

                let mlHr = 0;
                if (concDoseUnit === 'mcg/kg/min') {
                    mlHr = (rate * w * 60) / concMcgMl;
                } else if (concDoseUnit === 'mcg/kg/hr') {
                    mlHr = (rate * w) / concMcgMl;
                } else if (concDoseUnit === 'mg/kg/hr') {
                    mlHr = (rate * 1000 * w) / concMcgMl;
                }

                return mlHr.toFixed(2);
            }, [weight, concDrugAmount, concFluidVolume, concDoseRate, concDoseUnit]);

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full text-center border border-slate-200">
                            <div className="flex justify-center mb-4">
                                <img src={LOGO_URL} alt="DosiPedia Logo" className="h-28 object-contain" />
                            </div>
                            <h1 className="text-2xl font-bold text-slate-800 mb-1">เข้าสู่ระบบ DosiPedia</h1>
                            <p className="text-sm text-slate-500 mb-6">โรงพยาบาลสงขلا (Songkhla Hospital)</p>
                            
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <input 
                                        type="password"
                                        placeholder="••••••"
                                        value={pin}
                                        onChange={(e) => setPin(e.target.value)}
                                        className="w-full text-center text-2xl tracking-widest py-3 border border-pink-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-500"
                                        maxLength="6"
                                        autoFocus
                                    />
                                </div>
                                {loginError && <p className="text-red-500 text-xs">{loginError}</p>}
                                <button 
                                    type="submit"
                                    className="w-full bg-pink-500 hover:bg-pink-600 text-white font-medium py-3 rounded-xl shadow-lg shadow-pink-200 transition-all active:scale-98"
                                >
                                    เข้าสู่ระบบ
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-16">
                    {/* Top Header */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
                        <div className="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <img src={LOGO_URL} alt="Logo" className="h-10 w-auto object-contain" />
                                <div>
                                    <h1 className="text-lg font-bold text-slate-800 leading-none">DosiPedia</h1>
                                    <span className="text-xs text-pink-600 font-medium">Songkhla Hospital</span>
                                </div>
                            </div>
                            <button 
                                onClick={() => setIsLoggedIn(false)}
                                className="text-xs text-slate-400 hover:text-slate-600 bg-slate-100 px-2.5 py-1.5 rounded-lg"
                            >
                                ออกจากระบบ
                            </button>
                        </div>
                    </header>

                    <main className="max-w-md mx-auto p-4 space-y-4">
                        {/* Weight Input Box */}
                        <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                            <label className="block text-sm font-semibold text-slate-700 mb-2">
                                ⚖️ น้ำหนักตัวผู้ป่วย (Patient Weight)
                            </label>
                            <div className="relative flex items-center">
                                <input 
                                    type="number" 
                                    step="0.01"
                                    placeholder="ระบุน้ำหนัก..." 
                                    value={weight}
                                    onChange={(e) => setWeight(e.target.value)}
                                    className="w-full text-xl font-bold text-pink-600 bg-pink-50 border border-pink-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-500"
                                />
                                <span className="absolute right-4 font-bold text-slate-400">kg</span>
                            </div>
                        </div>

                        {/* Drug Selector */}
                        <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                            <label className="block text-sm font-semibold text-slate-700 mb-2">
                                💊 เลือกรายการยา (Select Drug)
                            </label>
                            <select 
                                value={selectedDrugId}
                                onChange={(e) => setSelectedDrugId(e.target.value)}
                                className="w-full text-base font-semibold text-slate-800 bg-slate-50 border border-slate-200 rounded-xl px-3 py-3 focus:outline-none focus:ring-2 focus:ring-pink-500"
                            >
                                {DRUG_DATA.map(d => (
                                    <option key={d.id} value={d.id}>{d.name}</option>
                                ))}
                            </select>
                        </div>

                        {/* Tabs */}
                        <div className="flex bg-slate-200 p-1 rounded-xl">
                            <button 
                                onClick={() => setActiveTab('rate')}
                                className={`flex-1 py-2 text-sm font-medium rounded-lg transition-all ${activeTab === 'rate' ? 'bg-white text-pink-600 shadow-sm' : 'text-slate-600'}`}
                            >
                                คำนวณขนาดยา (Dose Rate)
                            </button>
                            <button 
                                onClick={() => setActiveTab('conc')}
                                className={`flex-1 py-2 text-sm font-medium rounded-lg transition-all ${activeTab === 'conc' ? 'bg-white text-pink-600 shadow-sm' : 'text-slate-600'}`}
                            >
                                คำนวณความเข้มข้น/Rate (Infusion)
                            </button>
                        </div>

                        {/* TAB 1: Dose Rate Calculation */}
                        {activeTab === 'rate' && (
                            <div className="space-y-4 animate-fadeIn">
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-pink-100">
                                    <h3 className="text-sm font-bold text-slate-700 border-b pb-2 mb-3">
                                        ผลการคำนวณขนาดยา ({selectedDrug.name})
                                    </h3>

                                    {!weight ? (
                                        <p className="text-center py-6 text-slate-400 text-sm">กรุณากรอกน้ำหนักตัวเพื่อคำนวณ</p>
                                    ) : (
                                        <div className="space-y-3">
                                            {rateResults && rateResults.map((res, idx) => (
                                                <div key={idx} className="bg-pink-50/70 p-3.5 rounded-xl border border-pink-100">
                                                    <div className="text-xs font-semibold text-pink-700 mb-1">{res.name}</div>
                                                    <div className="text-2xl font-extrabold text-pink-600">
                                                        {res.isSingleValue ? res.min : `${res.min} - ${res.max}`}
                                                        <span className="text-sm font-normal text-slate-600 ml-2">{res.unit}</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* TAB 2: Concentration & Infusion Rate Calculator */}
                        {activeTab === 'conc' && (
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4 animate-fadeIn">
                                <h3 className="text-sm font-bold text-slate-700 border-b pb-2">
                                    คำนวณอัตราการหยดยา (Infusion Rate)
                                </h3>

                                <div className="space-y-3">
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600 mb-1 block">ปริมาณเนื้อยา (Drug Amount in mg)</label>
                                        <input 
                                            type="number" 
                                            placeholder="เช่น 250" 
                                            value={concDrugAmount}
                                            onChange={(e) => setConcDrugAmount(e.target.value)}
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600 mb-1 block">ปริมาตรสารสารละลายทั้งหมด (Total Volume in ml)</label>
                                        <input 
                                            type="number" 
                                            placeholder="เช่น 50" 
                                            value={concFluidVolume}
                                            onChange={(e) => setConcFluidVolume(e.target.value)}
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500"
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-xs font-semibold text-slate-600 mb-1 block">ขนาดยาที่ต้องการสั่ง</label>
                                            <input 
                                                type="number" 
                                                placeholder="เช่น 5" 
                                                value={concDoseRate}
                                                onChange={(e) => setConcDoseRate(e.target.value)}
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-xs font-semibold text-slate-600 mb-1 block">หน่วย (Unit)</label>
                                            <select 
                                                value={concDoseUnit}
                                                onChange={(e) => setConcDoseUnit(e.target.value)}
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-2 py-2 text-slate-800 text-xs focus:outline-none focus:ring-2 focus:ring-pink-500"
                                            >
                                                <option value="mcg/kg/min">mcg/kg/min</option>
                                                <option value="mcg/kg/hr">mcg/kg/hr</option>
                                                <option value="mg/kg/hr">mg/kg/hr</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-slate-900 text-white p-4 rounded-xl mt-4">
                                    <div className="text-xs text-slate-400">อัตราการบริหารยาทาง IV (Infusion Rate)</div>
                                    <div className="text-3xl font-extrabold text-pink-400 mt-1">
                                        {calculatedInfusionRate ? calculatedInfusionRate : '0.00'}
                                        <span className="text-sm font-normal text-slate-300 ml-2">ml/hr</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Drug Detailed Info Card */}
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                            <h3 className="text-sm font-bold text-slate-700 border-b pb-2 mb-3">
                                📋 ข้อมูลเพิ่มเติมและการบริหารยา
                            </h3>
                            <div className="text-xs text-slate-600 leading-relaxed whitespace-pre-line bg-slate-50 p-3.5 rounded-xl border border-slate-100">
                                {selectedDrug.info}
                            </div>
                        </div>

                        {/* Feedback Box */}
                        <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-2">
                            <label className="text-xs font-semibold text-slate-600 block">💬 ข้อเสนอแนะ / แจ้งปัญหาการใช้งาน</label>
                            <textarea 
                                rows="2"
                                placeholder="พิมพ์ข้อความที่นี่..."
                                value={feedbackText}
                                onChange={(e) => setFeedbackText(e.target.value)}
                                className="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-pink-500"
                            ></textarea>
                            <div className="flex justify-between items-center">
                                {feedbackSent ? (
                                    <span className="text-xs text-green-600 font-medium">✓ ส่งข้อความเรียบร้อยแล้ว</span>
                                ) : <span />}
                                <button 
                                    onClick={handleSendFeedback}
                                    className="bg-pink-500 hover:bg-pink-600 text-white text-xs px-4 py-2 rounded-lg font-medium transition-all"
                                >
                                    ส่งข้อความ
                                </button>
                            </div>
                        </div>
                    </main>

                    {/* Footer Section */}
                    <footer className="max-w-md mx-auto px-4 py-4 text-slate-400 text-[11px] leading-tight space-y-1">
                        <div>Developed by Chartkawee Jehsaree © Version 1.0 (24/7/26)</div>
                        <div>Songkhla Hospital</div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
