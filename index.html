        setTimeout(() => setToast({ show: false, message: '', type: '' }), 4000);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (password === '123456') {
          setIsLoggedIn(true);
          showNotification('เข้าสู่ระบบสำเร็จ ยินดีต้อนรับครับ', 'success');
        } else {
          showNotification('รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง', 'error');
        }
      };

      const sendToSheet = (type, details) => {
        const detailsStr = typeof details === 'object' ? details.details : details;
        const payloadData = typeof details === 'object' ? details : { type, details: detailsStr };

        if (GAS_WEB_APP_URL && GAS_WEB_APP_URL !== "YOUR_GAS_WEB_APP_URL_HERE") {
          fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: "saveToSheet", payload: payloadData }),
            redirect: 'follow'
          }).catch(err => console.error("API Error:", err));
        }

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          if (typeof google.script.run.logCalculation === 'function') {
            google.script.run.logCalculation(type, detailsStr);
          }
          if (typeof google.script.run.saveToSheet === 'function') {
            google.script.run.saveToSheet(payloadData);
          }
        }
      };

      const filteredDrugs = useMemo(() => {
        return DRUG_LIST.filter(drug => 
          drug.name.toLowerCase().includes(searchTerm.toLowerCase())
        );
      }, [searchTerm]);

      const s1Res = useMemo(() => {
        const w = parseFloat(weight);
        if (!w || w <= 0) {
          if (selectedDrug.hasMultipleChannels) {
            return {
              isMulti: true,
              channels: selectedDrug.channels.map(ch => ({
                title: ch.title,
                min: "0.00",
                max: "0.00",
                unit: ch.unit,
                hasAlt: !!ch.altUnit,
                altMin: "0.00",
                altMax: "0.00",
                altUnit: ch.altUnit || ""
              }))
            };
          }
          return { isMulti: false, min: "0.00", max: "0.00", unit: selectedDrug.unit, hasAlt: false, altMin: "0.00", altMax: "0.00" };
        }
        
        if (selectedDrug.hasMultipleChannels) {
          return {
            isMulti: true,
            channels: selectedDrug.channels.map(ch => ({
              title: ch.title,
              min: (ch.min * w).toFixed(2),
              max: (ch.max * w).toFixed(2),
              unit: ch.unit,
              hasAlt: !!ch.altUnit,
              altMin: ch.altMin ? (ch.altMin * w).toFixed(2) : "0.00",
              altMax: ch.altMax ? (ch.altMax * w).toFixed(2) : "0.00",
              altUnit: ch.altUnit || ""
            }))
          };
        }

        const mainMin = (selectedDrug.min * w).toFixed(2);
        const mainMax = (selectedDrug.max * w).toFixed(2);
        
        if (selectedDrug.hasDoubleUnit || selectedDrug.isFentanyl) {
          return {
            isMulti: false,
            min: mainMin,
            max: mainMax,
            unit: selectedDrug.unit,
            hasAlt: true,
            altMin: (selectedDrug.altMin * w).toFixed(2),
            altMax: (selectedDrug.altMax * w).toFixed(2),
            altUnit: selectedDrug.altUnit
          };
        }
        
        return { isMulti: false, min: mainMin, max: mainMax, unit: selectedDrug.unit, hasAlt: false, altMin: "0.00", altMax: "0.00" };
      }, [weight, selectedDrug]);

      const calculatedConcS2 = useMemo(() => {
        const pd = parseFloat(s2.drug);
        const ps = parseFloat(s2.sol);
        if (pd > 0 && ps > 0) {
          return (pd / ps).toFixed(2);
        }
        return "0.00";
      }, [s2.drug, s2.sol]);

      const s2Res = useMemo(() => {
        const pd = parseFloat(s2.drug), ps = parseFloat(s2.sol), pw = parseFloat(weight);
        const pdoMin = parseFloat(s2.dose);
        const pdoHr = parseFloat(s2.doseHr);
        const conc = parseFloat(calculatedConcS2);

        if (conc > 0 && pw > 0) {
          if (pdoMin > 0) {
            const rateMlHr = (((pdoMin / 1000) * pw) / conc) * 60;
            const mcgMin = (rateMlHr * conc * 1000) / 60;
            return { mlHr: rateMlHr.toFixed(2), mcgMin: mcgMin.toFixed(2), activeUnit: 'mcg/kg/min' };
          } else if (pdoHr > 0) {
            const rateMlHr = ((pdoHr / 1000) * pw) / conc;
            const mcgMin = (rateMlHr * conc * 1000) / 60;
            return { mlHr: rateMlHr.toFixed(2), mcgMin: mcgMin.toFixed(2), activeUnit: 'mcg/kg/hr' };
          }
        }
        return { mlHr: "0.00", mcgMin: "0.00", activeUnit: '' };
      }, [s2, weight, calculatedConcS2]);

      const s3Res = useMemo(() => {
        const pr = parseFloat(s3.rate), pw = parseFloat(weight);
        const pdoMin = parseFloat(s3.dose);
        const pdoHr = parseFloat(s3.doseHr);

        if (pr > 0 && pw > 0) {
          if (pdoMin > 0) {
            const conc = ((pw * pdoMin * 60) / (1000 * pr));
            const mcgMin = (pr * conc * 1000) / 60;
            return { conc: conc.toFixed(2), mcgMin: mcgMin.toFixed(2), activeUnit: 'mcg/kg/min' };
          } else if (pdoHr > 0) {
            const conc = ((pw * pdoHr) / (1000 * pr));
            const mcgMin = (pr * conc * 1000) / 60;
            return { conc: conc.toFixed(2), mcgMin: mcgMin.toFixed(2), activeUnit: 'mcg/kg/hr' };
          }
        }
        return { conc: "0.00", mcgMin: "0.00", activeUnit: '' };
      }, [s3, weight]);

      useEffect(() => {
        const pw = parseFloat(weight);
        if (weightTimerRef.current) clearTimeout(weightTimerRef.current);

        if (pw > 0) {
          const logMsg = `[ชื่อยา: ${selectedDrug.name}] Wt:${pw}kg`;
          weightTimerRef.current = setTimeout(() => {
            if (lastSentWeight.current !== logMsg) {
              lastSentWeight.current = logMsg;
              const mainMin = s1Res.isMulti ? (s1Res.channels[0]?.min || "-") : s1Res.min;
              const mainMax = s1Res.isMulti ? (s1Res.channels[0]?.max || "-") : s1Res.max;
              sendToSheet("Weight Entry", {
                drug: selectedDrug.name,
                weight: pw,
                s1_min: mainMin,
                s1_max: mainMax,
                s2_rate: s2Res.mlHr || "-",
                s3_conc: calculatedConcS2 || "-",
                type: "Weight Entry",
                details: logMsg
              });
            }
          }, 5000);
        }

        return () => {
          if (weightTimerRef.current) clearTimeout(weightTimerRef.current);
        };
      }, [weight, selectedDrug, s1Res, s2Res, calculatedConcS2]);

      useEffect(() => {
        const pd = parseFloat(s2.drug), ps = parseFloat(s2.sol), pw = parseFloat(weight);
        const pdoMin = parseFloat(s2.dose);
        const pdoHr = parseFloat(s2.doseHr);
        
        if (s2TimerRef.current) clearTimeout(s2TimerRef.current);

        if (pd > 0 && ps > 0 && pw > 0 && (pdoMin > 0 || pdoHr > 0)) {
          const activeDose = pdoMin > 0 ? `${pdoMin} mcg/kg/min` : `${pdoHr} mcg/kg/hr`;
          const logMsg = `[ชื่อยา: ${selectedDrug.name}] Drug:${pd}mg, Sol:${ps}ml, Dose:${activeDose}, Wt:${pw}kg => Rate:${s2Res.mlHr} ml/hr (${s2Res.mcgMin} mcg/min), Conc:${calculatedConcS2} mg/ml`;
          
          s2TimerRef.current = setTimeout(() => {
            if (lastSentS2.current !== logMsg) {
              lastSentS2.current = logMsg;
              sendToSheet("Find Rate", {
                drug: selectedDrug.name,
                weight: pw,
                s2_rate: s2Res.mlHr,
                s3_conc: calculatedConcS2,
                type: "Find Rate",
                details: logMsg
              });
            }
          }, 5000);
        }

        return () => {
          if (s2TimerRef.current) clearTimeout(s2TimerRef.current);
        };
      }, [s2Res, s2, weight, calculatedConcS2, selectedDrug]);

      useEffect(() => {
        const pr = parseFloat(s3.rate), pw = parseFloat(weight);
        const pdoMin = parseFloat(s3.dose);
        const pdoHr = parseFloat(s3.doseHr);

        if (s3TimerRef.current) clearTimeout(s3TimerRef.current);

        if (pr > 0 && pw > 0 && (pdoMin > 0 || pdoHr > 0)) {
          const activeDose = pdoMin > 0 ? `${pdoMin} mcg/kg/min` : `${pdoHr} mcg/kg/hr`;
          const logMsg = `[ชื่อยา: ${selectedDrug.name}] Rate:${pr}ml/hr, Dose:${activeDose}, Wt:${pw}kg => Conc:${s3Res.conc} mg/ml (${s3Res.mcgMin} mcg/min)`;
          
          s3TimerRef.current = setTimeout(() => {
            if (lastSentS3.current !== logMsg) {
              lastSentS3.current = logMsg;
              sendToSheet("Find Conc", {
                drug: selectedDrug.name,
                weight: pw,
                s2_rate: pr,
                s3_conc: s3Res.conc,
                type: "Find Conc",
                details: logMsg
              });
            }
          }, 5000);
        }

        return () => {
          if (s3TimerRef.current) clearTimeout(s3TimerRef.current);
        };
      }, [s3Res, s3, weight, selectedDrug]);

      const handleSendFeedback = () => {
        if (feedback.trim()) {
          if (GAS_WEB_APP_URL && GAS_WEB_APP_URL !== "YOUR_GAS_WEB_APP_URL_HERE") {
            fetch(GAS_WEB_APP_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: "saveFeedback", payload: { text: feedback } }),
              redirect: 'follow'
            }).catch(err => console.error("Feedback API Error:", err));
          }

          if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run.saveFeedback(feedback);
          }
          setFeedback('');
          showNotification('ส่งข้อเสนอแนะเรียบร้อยแล้ว ขอบพระคุณมากครับ');
        } else {
          showNotification('กรุณากรอกข้อความก่อนส่งครับ', 'error');
        }
      };

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-900 px-4">
            {toast.show && (
              <div className={`fixed top-5 right-5 z-50 p-4 rounded-xl shadow-2xl text-white font-bold fade-in flex items-center gap-2 ${toast.type === 'error' ? 'bg-rose-500' : 'bg-emerald-500'}`}>
                <span>{toast.type === 'error' ? '⚠️' : '✅'}</span>
                <span>{toast.message}</span>
              </div>
            )}
            <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center border border-slate-100">
              <div className="w-32 h-32 bg-pink-50 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-sm p-2">
                <img src={LOGO_URL} className="w-28 h-28 object-contain" alt="Logo" />
              </div>
              <h1 className="text-3xl font-extrabold mb-2 text-slate-800 tracking-tight">เข้าสู่ระบบ DosiPedia</h1>
              <p className="text-sm text-slate-400 mb-6 font-semibold">โรงพยาบาลสงขลา (Songkhla Hospital)</p>
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <input 
                    type="password" 
                    value={password} 
                    onChange={e=>setPassword(e.target.value)} 
                    className="w-full p-4 text-center border-2 border-slate-100 rounded-2xl text-2xl tracking-widest focus:border-pink-500 outline-none transition-all focus:ring-4 focus:ring-pink-50" 
                    placeholder="••••••" 
                    autoFocus
                  />
                </div>
                <button className="w-full py-4 bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-white font-bold rounded-2xl shadow-lg hover:shadow-pink-500/20 active:scale-98 transition-all">
                  เข้าสู่ระบบ
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="h-screen flex flex-col overflow-hidden bg-slate-50">
          {toast.show && (
            <div className={`fixed top-5 right-5 z-50 p-4 rounded-xl shadow-2xl text-white font-bold fade-in flex items-center gap-2 ${toast.type === 'error' ? 'bg-rose-500' : 'bg-emerald-500'}`}>
              <span>{toast.type === 'error' ? '⚠️' : '✅'}</span>
              <span>{toast.message}</span>
            </div>
          )}

          <header className="bg-white border-b border-slate-200 px-4 md:px-8 py-3 flex justify-between items-center shadow-sm shrink-0 z-10">
            <div className="flex items-center gap-3">
              <img src={LOGO_URL} className="w-12 h-12 md:w-16 md:h-16 object-contain" alt="Logo" />
              <div>
                <h1 className="text-lg md:text-xl font-extrabold text-slate-800 tracking-tighter flex items-center gap-2">
                  DosiPedia
                  <span className="text-[10px] bg-pink-100 text-pink-700 px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">
                    รพ.สงขลา
                  </span>
                </h1>
                <p className="text-[10px] text-slate-400 font-bold hidden md:block">PEDIATRIC DOSAGE CALCULATOR</p>
              </div>
            </div>

            <button 
              onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
              className="lg:hidden flex items-center gap-2 px-3 py-2 bg-pink-50 text-pink-600 rounded-xl font-bold text-sm hover:bg-pink-100 transition-colors"
            >
              <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
              </svg>
              <span>{selectedDrug.name}</span>
            </button>
          </header>

          <div className="flex flex-1 overflow-hidden relative">
            <aside className="w-72 bg-white border-r border-slate-200 flex flex-col shrink-0 hidden lg:flex">
              <div className="p-4 border-b border-slate-100 bg-slate-50/50">
                <div className="relative">
                  <input 
                    type="text" 
                    placeholder="🔍 ค้นหาชื่อยา..." 
                    value={searchTerm}
                    onChange={e => setSearchTerm(e.target.value)}
                    className="w-full pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-pink-500 focus:ring-2 focus:ring-pink-100 transition-all font-medium"
                  />
                </div>
              </div>
              <div className="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-1">
                {filteredDrugs.length > 0 ? (
                  filteredDrugs.map(d => (
                    <button 
                      key={d.name} 
                      onClick={() => setSelectedDrug(d)} 
                      className={`w-full text-left px-4 py-3 rounded-xl text-[13px] font-bold transition-all flex items-center justify-between ${
                        selectedDrug.name === d.name 
                          ? 'bg-gradient-to-r from-pink-500 to-rose-500 text-white shadow-md shadow-pink-500/10 scale-[1.02]' 
                          : 'hover:bg-slate-50 text-slate-600 border border-transparent hover:border-slate-100'
                      }`}
                    >
                      <span>{d.name}</span>
                      {selectedDrug.name === d.name && (
                        <span className="text-[10px] bg-white/20 px-1.5 py-0.5 rounded">Active</span>
                      )}
                    </button>
                  ))
                ) : (
                  <div className="text-center text-slate-400 py-8 text-xs font-semibold">ไม่พบรายชื่อยาที่ค้นหา</div>
                )}
              </div>
            </aside>

            {isMobileMenuOpen && (
              <div className="fixed inset-0 bg-slate-900/40 z-40 lg:hidden" onClick={() => setIsMobileMenuOpen(false)}>
                <div className="absolute top-0 left-0 w-80 h-full bg-white shadow-2xl flex flex-col p-4 fade-in" onClick={e => e.stopPropagation()}>
                  <div className="flex justify-between items-center mb-4">
                    <span className="text-sm font-extrabold text-slate-800">เลือกรายชื่อยา</span>
                    <button onClick={() => setIsMobileMenuOpen(false)} className="text-slate-400 hover:text-slate-600">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                      </svg>
                    </button>
                  </div>
                  <div className="mb-3">
                    <input 
                      type="text" 
                      placeholder="🔍 ค้นหาชื่อยา..." 
                      value={searchTerm}
                      onChange={e => setSearchTerm(e.target.value)}
                      className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-pink-500 font-medium"
                    />
                  </div>
                  <div className="flex-1 overflow-y-auto custom-scrollbar space-y-1">
                    {filteredDrugs.map(d => (
                      <button 
                        key={d.name} 
                        onClick={() => { setSelectedDrug(d); setIsMobileMenuOpen(false); }} 
                        className={`w-full text-left px-4 py-3 rounded-xl text-xs font-bold transition-all ${
                          selectedDrug.name === d.name ? 'bg-pink-600 text-white shadow-md' : 'hover:bg-slate-50 text-slate-600'
                        }`}
                      >
                        {d.name}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}

            <main className="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-6 bg-slate-50">
              <div className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-6 pb-12">
                <div className="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden flex flex-col fade-in">
                  <div className="bg-gradient-to-r from-pink-500 to-rose-500 px-6 py-4 text-white font-bold flex flex-col sm:flex-row justify-between sm:items-center gap-2">
                    <span className="text-xs sm:text-sm uppercase tracking-wider font-extrabold">1. คำนวณขนาดยาตามน้ำหนัก (Dose Range)</span>
                    <span className="text-[11px] bg-white/20 px-3 py-1 rounded-full text-white font-bold max-w-max">
                      {selectedDrug.name}
                    </span>
                  </div>
                  <div className="p-6 md:p-8 space-y-6 flex-1">
                    <div>
                      <label className="text-[11px] font-bold text-slate-400 uppercase mb-2 block ml-1 tracking-wider">
                        น้ำหนักตัวผู้ป่วย (Weight - KG)
                      </label>
                      <input 
                        type="number" 
                        value={weight} 
                        onChange={e=>setWeight(e.target.value)} 
                        className="w-full text-4xl md:text-5xl font-black p-5 md:p-6 bg-slate-100 rounded-3xl text-center outline-none focus:ring-4 ring-pink-100 border-2 border-transparent focus:border-pink-500 transition-all text-slate-800 shadow-inner" 
                        placeholder="0.0" 
                        min="0"
                        step="any"
                      />
                    </div>
                    
                    <div className="bg-slate-900 text-white p-6 md:p-8 rounded-2xl text-center shadow-2xl relative overflow-hidden space-y-4">
                      <div className="absolute top-0 right-0 p-4 opacity-10 pointer-events-none">
                        <img src={LOGO_URL} className="w-28 h-28 object-contain" alt="background logo" />
                      </div>
                      
                      {s1Res.isMulti ? (
                        <div className="space-y-4">
                          {s1Res.channels.map((ch, idx) => (
                            <div key={idx} className={`${idx > 0 ? 'border-t border-slate-800 pt-4' : ''}`}>
                              <div className="text-[11px] text-pink-300 font-extrabold uppercase mb-1 tracking-wider">{ch.title}</div>
                              <div className="text-2xl md:text-3xl font-black tracking-tight text-white">{ch.min} - {ch.max}</div>
                              <div className="text-[10px] text-pink-400 mt-1 uppercase font-extrabold tracking-widest bg-pink-950/40 px-3 py-0.5 rounded-full inline-block">
                                หน่วยยา: {ch.unit}
                              </div>
                              {ch.hasAlt && (
                                <div className="mt-2">
                                  <div className="text-[10px] text-teal-300 font-bold uppercase tracking-wider">ขนาดยาหน่วยพิเศษ</div>
                                  <div className="text-xl font-extrabold text-teal-400">{ch.altMin} - {ch.altMax} {ch.altUnit}</div>
                                </div>
                              )}
                            </div>
                          ))}
                        </div>
                      ) : (
                        <div>
                          <div className="text-[10px] text-slate-400 font-bold uppercase mb-1 tracking-widest">ช่วงขนาดยาที่แนะนำ (Main Dose Range)</div>
                          <div className="text-3xl md:text-4xl font-black tracking-tight text-white">{s1Res.min} - {s1Res.max}</div>
                          <div className="text-[10px] text-pink-400 mt-1 uppercase font-extrabold tracking-widest bg-pink-950/40 px-3 py-1 rounded-full inline-block">
                            หน่วยยา: {s1Res.unit}
                          </div>

                          {s1Res.hasAlt && (
                            <div className="border-t border-slate-800 pt-4 mt-3">
                              <div className="text-[10px] text-slate-400 font-bold uppercase mb-1 tracking-widest">ขนาดยาแนะนำหน่วยพิเศษ (Alternative Dose Range)</div>
                              <div className="text-2xl md:text-3xl font-black tracking-tight text-teal-400">{s1Res.altMin} - {s1Res.altMax}</div>
                              <div className="text-[10px] text-teal-400 mt-1 uppercase font-extrabold tracking-widest bg-teal-950/40 px-3 py-1 rounded-full inline-block">
                                หน่วยยา: {s1Res.altUnit}
                              </div>
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                    
                    <div className="bg-pink-50/40 p-5 rounded-2xl text-slate-700 info-text border border-pink-100 shadow-sm leading-relaxed">
                      <h4 className="font-extrabold text-pink-700 text-sm mb-2 flex items-center gap-1.5">
                        💡 รายละเอียดและวิธีใช้ยาสำหรับ {selectedDrug.name}
                      </h4>
                      <p className="text-slate-600 font-medium whitespace-pre-wrap">{selectedDrug.info}</p>
                    </div>
                  </div>
                </div>

                <div className="space-y-6">
                  <div className="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden fade-in animate-delay-100">
                    <div className="bg-blue-600 px-5 py-3 text-white text-xs font-extrabold uppercase tracking-wider flex justify-between items-center">
                      <span>2. คำนวณหาอัตราการไหล (Rate - ml/hr)</span>
                      {calculatedConcS2 !== "0.00" && (
                        <span className="bg-blue-700 text-white px-2.5 py-0.5 rounded-lg text-[10px] font-black">
                          ความเข้มข้น: {calculatedConcS2} mg/ml
                        </span>
                      )}
                    </div>
                    
                    <div className="p-6">
                      <div className="grid grid-cols-2 gap-4 mb-4">
                        <div>
                          <label className="text-[10px] font-bold text-slate-400 uppercase mb-1.5 block">ตัวยา (mg)</label>
                          <input 
                            type="number" 
                            value={s2.drug} 
                            onChange={e=>setS2({...s2, drug:e.target.value})} 
                            className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-center font-extrabold text-slate-700 focus:border-blue-500 focus:bg-white outline-none" 
                            placeholder="mg"
                          />
                        </div>
                        <div>
                          <label className="text-[10px] font-bold text-slate-400 uppercase mb-1.5 block">สารละลาย (ml)</label>
                          <input 
                            type="number" 
                            value={s2.sol} 
                            onChange={e=>setS2({...s2, sol:e.target.value})} 
                            className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-center font-extrabold text-slate-700 focus:border-blue-500 focus:bg-white outline-none" 
                            placeholder="ml"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-4 mb-6">
                        <div>
                          <label className="text-[10px] font-extrabold text-blue-600 uppercase mb-1.5 block text-center">Dose (mcg/kg/min)</label>
                          <input 
                            type="number" 
                            value={s2.dose} 
                            onChange={e=>setS2({...s2, dose:e.target.value, doseHr:''})} 
                            disabled={s2.doseHr !== ''}
                            className={`w-full p-3 border rounded-xl text-center font-black ${
                              s2.doseHr !== '' ? 'bg-slate-100 border-slate-200 text-slate-400' : 'bg-blue-50 border-blue-200 text-blue-700 focus:border-blue-500 focus:bg-white outline-none'
                            }`}
                            placeholder="กรอกช่องนี้"
                          />
                        </div>
                        <div>
                          <label className="text-[10px] font-extrabold text-indigo-600 uppercase mb-1.5 block text-center">Dose (mcg/kg/hr)</label>
                          <input 
                            type="number" 
                            value={s2.doseHr} 
                            onChange={e=>setS2({...s2, doseHr:e.target.value, dose:''})} 
                            disabled={s2.dose !== ''}
                            className={`w-full p-3 border rounded-xl text-center font-black ${
                              s2.dose !== '' ? 'bg-slate-100 border-slate-200 text-slate-400' : 'bg-indigo-50 border-indigo-200 text-indigo-700 focus:border-indigo-500 focus:bg-white outline-none'
                            }`}
                            placeholder="หรือช่องนี้"
                          />
                        </div>
                      </div>

                      <div className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-5 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-2 shadow-lg">
                        <div className="flex flex-col">
                          <span className="text-[10px] font-black uppercase tracking-widest opacity-80">ความเร็ว Infusion Pump:</span>
                          <span className="text-3xl font-black">{s2Res.mlHr} <span className="text-xs font-bold opacity-80">ml/hr</span></span>
                        </div>
                        <div className="border-t md:border-t-0 md:border-l border-white/20 pt-2 md:pt-0 md:pl-4 flex flex-col w-full md:w-auto items-center md:items-end">
                          <span className="text-[10px] font-black uppercase tracking-widest opacity-80">คิดเป็นความเร็วขนาดไมโครกรัม:</span>
                          <span className="text-2xl font-black text-blue-200">{s2Res.mcgMin} <span className="text-xs font-bold opacity-80">mcg/min</span></span>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden fade-in animate-delay-200">
                    <div className="bg-emerald-600 px-5 py-3 text-white text-xs font-extrabold uppercase tracking-wider">
                      3. คำนวณหาความเข้มข้นของยา (Conc. - mg/ml)
                    </div>
                    
                    <div className="p-6">
                      <div className="mb-4">
                        <label className="text-[10px] font-bold text-slate-400 uppercase mb-1.5 block">อัตราที่ให้เครื่องเดิน (ml/hr)</label>
                        <input 
                          type="number" 
                          value={s3.rate} 
                          onChange={e=>setS3({...s3, rate:e.target.value})} 
                          className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-center font-extrabold text-slate-700 focus:border-emerald-500 focus:bg-white outline-none" 
                          placeholder="ml/hr"
                        />
                      </div>

                      <div className="grid grid-cols-2 gap-4 mb-6">
                        <div>
                          <label className="text-[10px] font-extrabold text-emerald-600 uppercase mb-1.5 block text-center">Dose (mcg/kg/min)</label>
                          <input 
                            type="number" 
                            value={s3.dose} 
                            onChange={e=>setS3({...s3, dose:e.target.value, doseHr:''})} 
                            disabled={s3.doseHr !== ''}
                            className={`w-full p-3 border rounded-xl text-center font-black ${
                              s3.doseHr !== '' ? 'bg-slate-100 border-slate-200 text-slate-400' : 'bg-emerald-50 border-emerald-200 text-emerald-700 focus:border-emerald-500 focus:bg-white outline-none'
                            }`}
                            placeholder="กรอกช่องนี้"
                          />
                        </div>
                        <div>
                          <label className="text-[10px] font-extrabold text-teal-600 uppercase mb-1.5 block text-center">Dose (mcg/kg/hr)</label>
                          <input 
                            type="number" 
                            value={s3.doseHr} 
                            onChange={e=>setS3({...s3, doseHr:e.target.value, dose:''})} 
                            disabled={s3.dose !== ''}
                            className={`w-full p-3 border rounded-xl text-center font-black ${
                              s3.dose !== '' ? 'bg-slate-100 border-slate-200 text-slate-400' : 'bg-teal-50 border-teal-200 text-teal-700 focus:border-teal-500 focus:bg-white outline-none'
                            }`}
                            placeholder="หรือช่องนี้"
                          />
                        </div>
                      </div>

                      <div className="bg-gradient-to-r from-emerald-600 to-teal-600 text-white p-5 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-2 shadow-lg">
                        <div className="flex flex-col">
                          <span className="text-[10px] font-black uppercase tracking-widest opacity-80">ความเข้มข้นของยาในขวด:</span>
                          <span className="text-3xl font-black">{s3Res.conc} <span className="text-xs font-bold opacity-80">mg/ml</span></span>
                        </div>
                        <div className="border-t md:border-t-0 md:border-l border-white/20 pt-2 md:pt-0 md:pl-4 flex flex-col w-full md:w-auto items-center md:items-end">
                          <span className="text-[10px] font-black uppercase tracking-widest opacity-80">คิดเป็นความเร็วขนาดไมโครกรัม:</span>
                          <span className="text-2xl font-black text-emerald-200">{s3Res.mcgMin} <span className="text-xs font-bold opacity-80">mcg/min</span></span>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 fade-in animate-delay-300">
                    <h4 className="text-xs font-bold uppercase text-slate-400 mb-3 ml-1 tracking-wider">ข้อเสนอแนะ / แจ้งปัญหาการใช้งาน</h4>
                    <textarea 
                      value={feedback} 
                      onChange={e=>setFeedback(e.target.value)} 
                      className="w-full p-4 bg-slate-50 rounded-2xl text-sm h-20 border border-slate-200 focus:border-slate-400 focus:bg-white outline-none transition-all resize-none font-medium text-slate-600" 
                      placeholder="เขียนรายละเอียดข้อเสนอแนะหรือปัญหาที่นี่..." 
                    />
                    <button 
                      onClick={handleSendFeedback} 
                      className="w-full mt-3 py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-extrabold active:scale-98 transition-all tracking-wide uppercase shadow-sm"
                    >
                      ส่งรายงาน / ข้อเสนอแนะ
                    </button>
                  </div>
                </div>
              </div>
            </main>
          </div>

          <footer className="bg-white border-t border-slate-200 px-4 md:px-8 py-4 flex flex-col md:flex-row justify-between items-center gap-3 shrink-0 z-10 shadow-inner">
            <div className="text-center md:text-left">
              <p className="text-[11px] font-medium text-slate-700 tracking-tight">
                Developed by Chartkawee Jehsaree &copy; <span className="text-slate-500 font-semibold ml-1">Version 1.0 (24/7/26)</span>
              </p>
              <p className="text-[10px] text-pink-600 font-bold uppercase tracking-widest leading-none mt-1">
                Songkhla Hospital
              </p>
            </div>
            <div className="flex items-center gap-4 bg-slate-900 text-white px-4 md:px-5 py-2.5 rounded-xl shadow-lg">
              <div className="bg-pink-500 p-2 rounded-lg shadow-md shadow-pink-500/20">
                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="3.5" viewBox="0 0 24 24">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  <line x1="11" y1="8" x2="11" y2="14"></line>
                  <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
              </div>
              <div className="text-[11px] md:text-xs font-black leading-tight uppercase tracking-tight">
                ปรับขนาดหน้าจอ: <span className="text-pink-400 ml-1 underline decoration-2 underline-offset-4">กด Ctrl และ + หรือ -</span>
              </div>
            </div>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
